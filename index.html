<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #0066cc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 320px;
            box-sizing: border-box;
        }

        .login h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .login label {
            display: block;
            margin-bottom: 6px;
        }

        .login input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            box-sizing: border-box;
        }

        .login button {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="login">
        <h1>Login</h1>

        <form action="/login" method="POST">

            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>

            <button type="submit">Entrar</button>

        </form>
    </div>

</body>
</html>
